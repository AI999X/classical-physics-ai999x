[package]
name = "classical-physics-ai999x"
description = "Classical Physics by AI999X: offline answers with units, checked against their own equations (Rust build)"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "classical-physics"
path = "src/main.rs"

[lib]
path = "src/lib.rs"
# rlib for the command line; cdylib is the browser module (cargo build --target wasm32-unknown-unknown)
crate-type = ["rlib", "cdylib"]

[dependencies]
ax-engine = { path = "../ax-engine" }
serde_json = "1"
